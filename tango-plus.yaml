---
name: TANGO-PLUS
version: 1.0.0
description: "A comprehensive startup validation framework synthesizing methodologies from Thiel, Abraham, Naval, Graham, Bier, and Willison"
license: MIT
repository: https://github.com/yourusername/tango-plus
documentation: https://yourusername.github.io/tango-plus

# Main contributors and their focus areas
contributors:
  - name: "Peter Thiel"
    symbol: "🔺"
    focus: "Category creation, monopoly position"
    key_principle: "Start with a small market you can dominate"

  - name: "Jay Abraham"
    symbol: "📈"
    focus: "Authority positioning, client value"
    key_principle: "Position as trusted authority, not vendor"

  - name: "Naval Ravikant"
    symbol: "💰"
    focus: "Leveraged systems, permissionless growth"
    key_principle: "Seek business models with zero marginal cost"

  - name: "Paul Graham"
    symbol: "🧪"
    focus: "User validation, iterative development"
    key_principle: "Make something people want"

  - name: "Nikit Bier"
    symbol: "💡"
    focus: "Paradigm disruption, exponential growth"
    key_principle: "Identify and invert limiting industry assumptions"

  - name: "Simon Willison"
    symbol: "⚡"
    focus: "Rapid prototyping, expertise amplification"
    key_principle: "Accelerate development cycles through appropriate tools"

# Core formulas that drive the framework
formulas:
  - name: "Minimum Viable Product"
    formula: "MVP = f(CoreValue, UserPain, MinimalFeatures)"

  - name: "Product-Market Fit"
    formula: "PMF = Σ(UserEngagement, Retention, Referral, Disappointment)"

  - name: "Viable Acquisition Model"
    formula: "CAC < LTV/3"

  - name: "Growth"
    formula: "Growth = InitialTraction × Virality^t × Retention"

  - name: "Monopoly"
    formula: "Monopoly = CategoryCreation + 10xValue + NetworkEffects"

  - name: "Marketing ROI"
    formula: "MarketingROI = (Revenue - MarketingCost) / MarketingCost"

  - name: "Exponential Value"
    formula: "ExponentialValue = InitialValue × CompoundingRate^t"

  - name: "Validation Score"
    formula: "ValidationScore = (ProblemValidation + SolutionValidation + MarketValidation + BusinessModelValidation) / 4"

# Framework components and their elements
framework_components:
  - name: "Category Creation Validation"
    symbol: "🔺"
    elements:
      - name: "Contrarian Truth Assessment"
        symbol: "🧠"
      - name: "Industry Paradigm Disruption"
        symbol: "💥"
      - name: "Category Concept Validation"
        symbol: "🧪"
      - name: "Rapid Category Prototyping"
        symbol: "⚡"

  - name: "Product Strategy Validation"
    symbol: "🛠️"
    elements:
      - name: "Core Value Determination"
        symbol: "💎"
      - name: "Value Multiplication"
        symbol: "📈"
      - name: "Development Acceleration"
        symbol: "🚀"
      - name: "User Outcome Metrics"
        symbol: "📊"

  - name: "Leverage Systems Validation"
    symbol: "💪"
    elements:
      - name: "Code Leverage"
        symbol: "💻"
      - name: "Capital Leverage"
        symbol: "💰"
      - name: "Paradigm Leverage"
        symbol: "🧠"
      - name: "Acceleration Leverage"
        symbol: "⚡"

  - name: "Marketing Strategy Validation"
    symbol: "📣"
    elements:
      - name: "Authority Positioning"
        symbol: "👑"
      - name: "Contrast Creation"
        symbol: "⚔️"
      - name: "Mental Model Disruption"
        symbol: "🧠"
      - name: "Marketing Experimentation"
        symbol: "🧪"

# Minimum Viable Token (MVT) for quick implementation
mvt_tasks:
  - task: "Define category name and core positioning statement (10 words or less)"
    priority: 1

  - task: "Create contrarian truth one-pager with supporting evidence"
    priority: 2

  - task: "Develop 3 clear problem statements from customer interviews"
    priority: 3

  - task: "Build authority-building content roadmap (3-month plan)"
    priority: 4

  - task: "Design conversion funnel with clear stage definitions"
    priority: 5

  - task: "Create risk-reversal mechanism for early adopters"
    priority: 6

  - task: "Define viral loop mechanic in product/marketing"
    priority: 7

  - task: "Establish key metrics dashboard for marketing validation"
    priority: 8

  - task: "Develop systematic A/B testing protocol for messaging"
    priority: 9

  - task: "Create client outcome documentation process"
    priority: 10

# Validation scoring system
validation_scoring:
  components:
    - name: "Problem Validation"
      max_score: 10

    - name: "Solution Validation"
      max_score: 10

    - name: "Market Validation"
      max_score: 10

    - name: "Business Model Validation"
      max_score: 10

  total_score: 40
  minimum_viable_score: 28

# Framework files and structure
files:
  - name: "README.md"
    path: "/"
    description: "Project overview and quick start"

  - name: "framework.md"
    path: "/"
    description: "Complete TANGO-PLUS framework documentation"

  - name: "mvt-checklist.md"
    path: "/"
    description: "Minimum Viable Token implementation checklist"

  - name: "validation-scoring.md"
    path: "/"
    description: "Scoring templates for tracking validation progress"

  - name: "framework-guide.md"
    path: "/docs/"
    description: "Comprehensive guide to using the framework"

  - name: "questionnaires.md"
    path: "/docs/"
    description: "Validation questionnaires for each framework component"

  - name: "scoring-system.md"
    path: "/docs/"
    description: "Detailed explanation of the validation scoring system"

  - name: "case-studies.md"
    path: "/docs/"
    description: "Real-world examples of framework application"

  - name: "implementation.md"
    path: "/docs/"
    description: "Step-by-step implementation playbook"

# Usage examples and applications
usage_examples:
  - name: "Validating new startup concepts"
    symbol: "✅"

  - name: "Assessing existing business models"
    symbol: "🔄"

  - name: "Optimizing marketing strategies"
    symbol: "📣"

  - name: "Accelerating product development cycles"
    symbol: "🚀"

  - name: "Creating new market categories"
    symbol: "🏆"

  - name: "Building defensible business positions"
    symbol: "🛡️"

# Master validation questions
master_questions:
  - question: "Does this solve a real, painful problem for a specific customer segment?"
    weight: 10

  - question: "Can we reach these customers efficiently and convert them predictably?"
    weight: 9

  - question: "Is our solution 10x better than alternatives on at least one critical dimension?"
    weight: 9

  - question: "Can we create a monopoly position in this initial market segment?"
    weight: 8

  - question: "Does this business generate exponential rather than linear returns?"
    weight: 8

  - question: "Do we have a viable path to scale with network effects or other defensibility?"
    weight: 7

  - question: "Can we validate marketing assumptions rapidly and systematically?"
    weight: 7

  - question: "Are we positioned as unique category creators rather than marginal improvers?"
    weight: 6

  - question: "Do we have mechanisms to accelerate learning and implementation cycles?"
    weight: 6

  - question: "Can we articulate and demonstrate specific, compelling customer outcomes?"
    weight: 5
